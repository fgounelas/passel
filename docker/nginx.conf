pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 100000000;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8080;
        server_name _;
        if ($http_host != "@PASSEL_HOST@") { return 421; }
        location /api/project-files/ {
            proxy_pass http://127.0.0.1:8788;
            proxy_set_header Host $http_host;
            proxy_set_header X-Herdr-Gateway "@GATEWAY_TOKEN@";
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout 310s;
        }
        location / {
            proxy_pass http://127.0.0.1:8787;
            # The external Host was validated above. The bridge has a fixed
            # internal port; keep its Host check independent of the HTTPS port.
            proxy_set_header Host 127.0.0.1:8787;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
